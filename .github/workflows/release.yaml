name: release

# 仅在推送 v* 标签时触发，用于自动构建并发布 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # GoReleaser 需要写权限来创建 Release 与上传产物

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 必须拉取完整历史，否则无法基于历史标签生成 changelog

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # 使用 go.mod 中声明的 Go 版本，避免与实际构建版本不一致
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
